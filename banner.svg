<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="sirgijoe: Built with care. Shared like a knight.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2a40" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .line1 { animation: show 0.01s linear 0.3s both; }
    .line2 { animation: show 0.01s linear 1.2s both; }
    .title { animation: rise 0.9s ease-out 1.8s both; }
    .tag   { animation: rise 0.9s ease-out 2.3s both; }
    .chips { animation: rise 0.9s ease-out 2.8s both; }
    .joe   { animation: rise 1s ease-out 1.4s both; }
    #cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, #cursor, .joe, .line1, .line2, .title, .tag, .chips { animation: none; }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="5" fill="url(#accent)"/>

    <g class="mono" font-size="17" fill="#4ade80">
      <text class="line1" x="64" y="72">&gt; whoami</text>
      <text class="line2" x="64" y="100" fill="#8fa3bf">husband · father · grandfather · veteran · builder</text>
    </g>

    <text class="title sans" x="62" y="188" font-size="84" font-weight="800" fill="#f1f5f9" letter-spacing="-2">sirgijoe<tspan class="cursor" fill="#4ade80">_</tspan></text>

    <text class="tag sans" x="66" y="234" font-size="26" fill="#cbd5e1">Built with care. Shared like a knight.</text>

    <g class="chips mono" font-size="15">
      <rect x="64" y="266" width="150" height="34" rx="17" fill="#132238" stroke="#4ade80" stroke-opacity="0.6"/>
      <text x="139" y="288" text-anchor="middle" fill="#4ade80">free forever</text>
      <rect x="226" y="266" width="150" height="34" rx="17" fill="#132238" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="301" y="288" text-anchor="middle" fill="#38bdf8">open source</text>
      <rect x="388" y="266" width="186" height="34" rx="17" fill="#132238" stroke="#cbd5e1" stroke-opacity="0.45"/>
      <text x="481" y="288" text-anchor="middle" fill="#cbd5e1">runs on your PC</text>
    </g>

    <!-- Joe-AI, official design H -->
    <g class="joe">
<svg x="892" y="26" width="255" height="300" viewBox="0 0 400 470">
<defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e8ede9"/><stop offset="1" stop-color="#c3cdc6"/></linearGradient>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d3dcd6"/><stop offset="1" stop-color="#97a69e"/></linearGradient>
  <radialGradient id="scr" cx=".35" cy=".3" r=".9">
    <stop offset="0" stop-color="#1b2a25"/><stop offset="1" stop-color="#0a1210"/></radialGradient>
  <linearGradient id="mug" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#cfc7b8"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<g stroke="#2b2d3a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
  <!-- feet -->
  <rect x="108" y="420" width="58" height="34" rx="16" fill="url(#shell)"/>
  <rect x="176" y="420" width="58" height="34" rx="16" fill="url(#shell)"/>
  <!-- waving arm + hand -->
  <path d="M104 340 Q76 336 54 314" fill="none" stroke-width="20"/>
  <path d="M104 340 Q76 336 54 314" fill="none" stroke="#c8d2cb" stroke-width="11"/>
  <rect x="16" y="282" width="48" height="48" rx="21" fill="url(#shell)"/>
  <!-- right arm to mug -->
  <path d="M236 348 Q258 356 272 352" fill="none" stroke-width="20"/>
  <path d="M236 348 Q258 356 272 352" fill="none" stroke="#c8d2cb" stroke-width="11"/>
  <!-- neck -->
  <rect x="146" y="276" width="50" height="30" rx="8" fill="#5a5f72"/>
  <!-- body (tower) -->
  <rect x="100" y="300" width="142" height="124" rx="30" fill="url(#shell)"/>
  <rect x="124" y="330" width="94" height="12" rx="6" fill="#2a2e33" stroke-width="3"/>
  <rect x="124" y="354" width="44" height="8" rx="4" fill="#b6c1ba" stroke="none"/>
  <!-- mug -->
  <path d="M322 336 q30 0 30 24 t-30 24" fill="none" stroke-width="16"/>
  <path d="M322 336 q30 0 30 24 t-30 24" fill="none" stroke="#e5e0d6" stroke-width="7"/>
  <rect x="266" y="322" width="64" height="76" rx="14" fill="url(#mug)"/>
  <ellipse cx="298" cy="330" rx="26" ry="6" fill="#7a4a28" stroke-width="3"/>
  <!-- CRT depth behind the head -->
  <rect x="236" y="62" width="104" height="186" rx="40" fill="url(#back)"/>
  <!-- antenna -->
  <path d="M170 44 L170 18" stroke-width="12"/><path d="M170 44 L170 18" stroke="#c8d2cb" stroke-width="5"/>
  <!-- head shell -->
  <rect x="38" y="38" width="264" height="246" rx="56" fill="url(#shell)"/>
  <!-- screen -->
  <rect x="68" y="70" width="204" height="166" rx="40" fill="url(#scr)" stroke-width="6"/>
</g>
<!-- vents on the back -->
<g stroke="#8a988f" stroke-width="5" stroke-linecap="round"><path d="M318 110 L330 110"/><path d="M318 132 L330 132"/><path d="M318 154 L330 154"/><path d="M318 176 L330 176"/></g>
<!-- shell highlights -->
<ellipse cx="96" cy="62" rx="40" ry="10" fill="#fff" opacity=".9" filter="url(#soft)"/>
<ellipse cx="140" cy="318" rx="26" ry="6" fill="#fff" opacity=".8" filter="url(#soft)"/>
<!-- coffee splash on the top-left corner, with a drip -->
<path d="M58 54 q14 -12 34 -10 q-6 6 -16 8 q-10 4 -14 16 q-2 8 -8 10 q-4 -14 4 -24z" fill="#7a4a28"/>
<path d="M44 92 q4 -14 6 -2 q1 12 -3 20 q-4 -8 -3 -18z" fill="#7a4a28"/>
<circle cx="47" cy="118" r="3.5" fill="#64402a"/>
<!-- under-screen knobs + power LED -->
<circle cx="84" cy="258" r="5" fill="#b6c1ba"/><circle cx="100" cy="258" r="5" fill="#b6c1ba"/>
<circle cx="268" cy="258" r="5" fill="#5dff8a" filter="url(#glow)"/>
<!-- body LED -->
<circle cx="132" cy="394" r="5" fill="#5dff8a" filter="url(#glow)"/>
<!-- antenna cursor (blinks in the app) -->
<rect id="cursor" x="156" y="2" width="28" height="14" rx="3" fill="#5dff8a" filter="url(#glow)"/>
<!-- screen gloss -->
<path d="M86 108 q2 -26 34 -28 l28 0 q-46 8 -54 40 z" fill="#ffffff" opacity=".12"/>
<!-- face -->
<g id="face" filter="url(#glow)"><rect x="125.0" y="126.0" width="20" height="32" rx="10.0" fill="#5dff8a"/><rect x="195.0" y="126.0" width="20" height="32" rx="10.0" fill="#5dff8a"/><rect x="129" y="130" width="5" height="9" rx="2.5" fill="#d4ffe0" opacity=".85"/><rect x="199" y="130" width="5" height="9" rx="2.5" fill="#d4ffe0" opacity=".85"/><path d="M154 182 Q170 198 186 182" stroke="#5dff8a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- steam -->
<g fill="none" stroke="#b9c6d4" stroke-width="5" stroke-linecap="round" opacity=".9">
  <path d="M286 312 q-10 -12 0 -24 t0 -24"/><path d="M310 312 q10 -12 0 -24 t0 -24"/></g>
</svg>
    </g>
  </g>
</svg>
